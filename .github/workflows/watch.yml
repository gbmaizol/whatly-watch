name: Whatly watch

on:
  schedule:
    - cron: '17 */6 * * *'   # 00:17, 06:17, 12:17, 18:17 UTC. GitHub often runs these late.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whatly-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Anything moved?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look
        id: look
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./watch.sh
        continue-on-error: true

      - name: Record what moved
        if: steps.look.outcome == 'failure'
        run: |
          git config user.name  gbmaizol
          git config user.email 1095647+gbmaizol@users.noreply.github.com
          if ! git diff --quiet -- state.json; then
            git add state.json
            git commit -m "state: Whatly moved"
            git push
          fi

      - name: Fail so the mail goes out
        if: steps.look.outcome == 'failure'
        run: |
          echo "Something moved — see the run summary above." >&2
          exit 1
